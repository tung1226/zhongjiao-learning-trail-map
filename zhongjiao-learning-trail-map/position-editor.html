<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>學道座標調整工具｜中角國小</title>
  <style>
    *{box-sizing:border-box} body{margin:0;font-family:"PingFang TC","Microsoft JhengHei",sans-serif;background:#eef5f2;color:#243234}
    header{position:sticky;top:0;z-index:20;background:#fff;padding:12px 18px;border-bottom:1px solid #d8e4df;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:20px;margin:0}.note{font-size:13px;color:#607273}.actions{display:flex;gap:8px}
    button{border:0;border-radius:10px;padding:9px 12px;background:#185a69;color:#fff;font-weight:700;cursor:pointer}button.alt{background:#fff;color:#185a69;border:1px solid #b9cfca}
    .wrap{padding:16px}.map{position:relative;width:min(1400px,100%);aspect-ratio:2047/1482;margin:auto;box-shadow:0 16px 40px #15343a22;background:#fff}
    .map img{width:100%;height:100%;display:block}.pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #fff;background:#185a69;color:#fff;display:grid;place-items:center;font-weight:900;cursor:grab;box-shadow:0 5px 12px #0004;touch-action:none}.pin:active{cursor:grabbing;background:#d98b2b}
    textarea{width:min(1400px,100%);display:block;margin:16px auto 0;min-height:220px;border:1px solid #c7d8d3;border-radius:12px;padding:12px;font-family:ui-monospace,monospace;font-size:12px;background:#fff}
  </style>
</head>
<body>
<header>
  <div><h1>中角國小學道座標調整工具</h1><div class="note">拖曳號碼到正確位置；完成後按「複製座標」，再把 x/y 更新到 trail-data.js。</div></div>
  <div class="actions"><button id="copyBtn">複製座標</button><button id="resetBtn" class="alt">重新載入</button><a href="index.html"><button class="alt">回首頁</button></a></div>
</header>
<div class="wrap">
  <div id="map" class="map"><img src="assets/campus-map.jpg" alt="校園地圖"><div id="pins"></div></div>
  <textarea id="output" aria-label="座標輸出"></textarea>
</div>
<script src="trail-data.js"></script>
<script>
const map=document.getElementById('map'), pins=document.getElementById('pins'), output=document.getElementById('output');
const local=window.TRAILS.map(t=>({...t}));
function renderOut(){output.value=local.map(t=>`{ id: ${t.id}, x: ${t.x.toFixed(1)}, y: ${t.y.toFixed(1)} }, // ${t.name}`).join('\n')}
local.forEach(t=>{const p=document.createElement('div');p.className='pin';p.textContent=String(t.id).padStart(2,'0');p.style.left=t.x+'%';p.style.top=t.y+'%';p.title=t.name;p.dataset.id=t.id;p.addEventListener('pointerdown',e=>{p.setPointerCapture(e.pointerId);const move=ev=>{const r=map.getBoundingClientRect();let x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;x=Math.max(0,Math.min(100,x));y=Math.max(0,Math.min(100,y));t.x=x;t.y=y;p.style.left=x+'%';p.style.top=y+'%';renderOut()};const up=ev=>{p.releasePointerCapture(ev.pointerId);p.removeEventListener('pointermove',move);p.removeEventListener('pointerup',up)};p.addEventListener('pointermove',move);p.addEventListener('pointerup',up)});pins.appendChild(p)});renderOut();
document.getElementById('copyBtn').onclick=async()=>{renderOut();await navigator.clipboard.writeText(output.value);document.getElementById('copyBtn').textContent='已複製 ✓';setTimeout(()=>document.getElementById('copyBtn').textContent='複製座標',1400)};
document.getElementById('resetBtn').onclick=()=>location.reload();
</script>
</body>
</html>
