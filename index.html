<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="中角國小學習步道地圖">
  <title>中角國小學習步道地圖</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="intro" class="intro" aria-label="開場影片">
    <video id="introVideo" autoplay muted playsinline preload="auto">
      <source src="assets/將以上圖片變成一個短動畫.mp4" type="video/mp4">
    </video>
    <div class="intro-fallback">
      <h1>中角國小學習步道地圖</h1>
      <p>開場影片載入後將自動播放</p>
    </div>
    <div class="intro-controls">
      <button id="soundBtn" class="glass-btn" type="button">🔇 開啟聲音</button>
      <button id="skipBtn" class="glass-btn" type="button">跳過動畫 →</button>
    </div>
  </section>

  <main id="app" class="app is-hidden">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">ZHONGJIAO ELEMENTARY SCHOOL</p>
        <h1>中角國小學習步道地圖</h1>
        <p class="subtitle">走進校園・探索學習・發現中角</p>
      </div>
      <div class="header-actions">
        <button id="replayBtn" class="secondary-btn" type="button">▶ 重播開場</button>
      </div>
    </header>

    <section class="toolbar" aria-label="搜尋與瀏覽">
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜尋學道名稱或編號，例如：衝浪、29">
      </label>
      <div class="toolbar-hint">點擊地圖上的號碼，查看學道並前往 Google Sites</div>
    </section>

    <section class="map-section">
      <div class="map-card">
        <div id="mapStage" class="map-stage">
          <img src="assets/中角學習步道圖(文字).jpg" alt="中角國小校園平面圖" id="campusMap">
          <div id="markers" class="markers" aria-label="學習步道位置"></div>
        </div>
        <div class="map-help">可點擊 01～30 號學道標記；手機可雙指縮放圖片。</div>
      </div>

      <aside id="detailPanel" class="detail-panel" aria-live="polite">
        <div class="detail-empty">
          <div class="detail-empty-icon">🗺️</div>
          <h2>選擇一個學習步道</h2>
          <p>點擊地圖上的號碼，或從下方學道總覽選擇。</p>
        </div>
      </aside>
    </section>

    <section class="trail-section">
      <div class="section-title">
        <div>
          <p class="eyebrow">LEARNING TRAILS</p>
          <h2>30 個學習步道</h2>
        </div>
        <p>每一個項目都已連結至對應的 Google Sites 學習內容。</p>
      </div>
      <div id="trailGrid" class="trail-grid"></div>
    </section>

    <footer>
      <strong>新北市金山區中角國民小學</strong>
      <span>中角國小學習步道地圖</span>
    </footer>
  </main>

  <script src="trail-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
