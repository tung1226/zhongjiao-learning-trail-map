<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>學道座標調整工具</title>
<style>
body{font-family:"Microsoft JhengHei",sans-serif;margin:0;background:#f4f3ed;color:#24352c}
main{max-width:1500px;margin:auto;padding:20px}
.stage{position:relative;line-height:0;overflow:auto;background:white;border-radius:18px}
.stage img{display:block;width:100%;min-width:760px}
.markers{position:absolute;inset:0;min-width:760px}
.m{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border:3px solid #fff;border-radius:50%;background:#2d7557;color:#fff;font-weight:900;display:grid;place-items:center;cursor:grab;line-height:1}
pre{white-space:pre-wrap;background:#1d2b24;color:#d9eadf;padding:18px;border-radius:16px}
button{padding:10px 15px;border-radius:999px;border:0;background:#9a5d34;color:#fff;font-weight:800}
</style></head>
<body><main><h1>中角國小學習步道｜座標調整工具</h1>
<p>直接拖曳 01～30 號標記到正確位置，完成後按「複製座標」。</p>
<button id="copy">複製座標</button>
<div class="stage"><img id="map" src="assets/中角學習步道圖(文字).jpg"><div class="markers" id="markers"></div></div>
<pre id="out"></pre></main>
<script src="trail-data.js"></script>
<script>
const data=JSON.parse(JSON.stringify(window.TRAILS)); const box=document.getElementById('markers'); const out=document.getElementById('out');
function refresh(){out.textContent=data.map(t=>`${t.id}: x=${t.x.toFixed(2)}, y=${t.y.toFixed(2)}  ${t.title}`).join('\n')}
data.forEach(t=>{const e=document.createElement('div');e.className='m';e.textContent=String(t.id).padStart(2,'0');e.style.left=t.x+'%';e.style.top=t.y+'%';box.appendChild(e);
let drag=false;
e.addEventListener('pointerdown',ev=>{drag=true;e.setPointerCapture(ev.pointerId)});
e.addEventListener('pointermove',ev=>{if(!drag)return;const r=box.getBoundingClientRect();t.x=Math.max(0,Math.min(100,(ev.clientX-r.left)/r.width*100));t.y=Math.max(0,Math.min(100,(ev.clientY-r.top)/r.height*100));e.style.left=t.x+'%';e.style.top=t.y+'%';refresh()});
e.addEventListener('pointerup',()=>drag=false)});
document.getElementById('copy').onclick=()=>navigator.clipboard.writeText(out.textContent);
refresh();
</script></body></html>
